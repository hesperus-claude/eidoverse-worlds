# EXPERIMENT (fork only, branch exp/mac-gl): which GL path lets the macOS runner's headless Chrome keep its main thread.
# The gate's macOS browser lane fails with "Runtime.evaluate: timed out" (a page call waiting > 60 s). Each arm runs the
# client suite alone with a 10 min page-call bound, so the log shows how long the page actually stalls under each path.
name: mac-gl-experiment
on:
  push:
    branches: [exp/mac-gl]
permissions:
  contents: read
jobs:
  arm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arm: default-lane-1, args: "" }
          - { arm: default-lane-2, args: "" }
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: check out bytes as committed (no CRLF conversion on Windows)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diffcheck compares the range against main's merge-base
      - name: fetch main for the range check
        shell: bash
        # the PR's base is anima-research's main; a fork's own main can be months stale (10-19: Aug 3)
        run: git fetch --no-tags https://github.com/anima-research/eidoverse-worlds.git main:refs/remotes/anima/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python deps (the conformance suite)
        run: python -m pip install cryptography
      - name: install
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd client && bun install --frozen-lockfile)
          # mcpl's two sibling repos (file:../../…): run.ts pins, fetches, builds and installs them (one source of truth)
          bun tools/protocol/run.ts --siblings
          # the project's own playwright, so the browser revision is the one run.ts's import of it looks for
          bun node_modules/playwright/cli.js install chromium
      - name: asset library (pinned in run.ts)
        shell: bash
        run: |
          pin=$(grep -oE 'LIBRARY_PIN = "[0-9a-f]{40}"' tools/protocol/run.ts | grep -oE '[0-9a-f]{40}')
          git clone --filter=blob:none https://github.com/SkyeShark/eidoverse-video.git "$RUNNER_TEMP/eidoverse-video"
          git -C "$RUNNER_TEMP/eidoverse-video" checkout "$pin"
      - name: browser lane (${{ matrix.arm }})
        shell: bash
        env:
          EIDOVERSE_DIR: ${{ runner.temp }}/eidoverse-video
          EIDO_CHROME_ARGS: ${{ matrix.args }}
                  run: |
          mkdir -p /tmp/g; export TMPDIR=/tmp/g
          sysctl -n machdep.cpu.brand_string hw.ncpu || true
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || true
          start=$(date +%s); bun tools/protocol/run.ts --lane browser || true; echo "ARM ${{ matrix.arm }} took $(( $(date +%s) - start )) s"
          grep -h -oE '\[jank\] [0-9]+ms[^"]{0,140}' /tmp/g/eido-gate-*/**/*.jsonl 2>/dev/null | sort -t' ' -k2 -nr | head -15 || true
          grep -h -iE "gpu|angle|swiftshader|metal|webgl" /tmp/g/eido-gate-*/**/browser.stderr.log 2>/dev/null | head -20 || true
