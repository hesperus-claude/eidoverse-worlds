# The sandbox of the home server's two services (eidoverse-home.service, eidoverse-home-door.service), written once:
# start.sh installs this file as a drop-in of each, and inside.sh runs a one-off command under the same lines.
# Shape: a network namespace holding only its own loopback, an allow-list filesystem (an empty read-only root, then
# exactly the binds below), no capabilities, a syscall filter. Why each line, and what was measured:
# docs/research/home-sandbox.md. sandbox-probe.ts tests it from the inside.
[Service]
# ---- network: a private namespace with loopback only; the one way in is the -proxy socket units ----
PrivateNetwork=yes
IPAddressDeny=any
IPAddressAllow=localhost
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK

# ---- filesystem: an allow-list. An empty read-only root, then only these ----
TemporaryFileSystem=/:ro
TemporaryFileSystem=/tmp:size=256m,mode=1777,nosuid,nodev,noexec
# bun's loader and glibc (Debian and Ubuntu on x86_64; start.sh refuses another layout)
BindReadOnlyPaths=/usr/lib/x86_64-linux-gnu /usr/lib64:/lib64 /usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu
BindReadOnlyPaths=/opt/eidoverse-home/app /opt/eidoverse-home/bin @LIBRARY@:/opt/eidoverse-home/library
BindReadOnlyPaths=/etc/eidoverse-home/agent-tokens.json
BindPaths=/var/lib/eidoverse-home
# every other user of the machine reads as nobody in here
PrivateUsers=yes
PrivateDevices=yes
MountAPIVFS=yes
# MountAPIVFS brings a writable /run and the host's /sys; nothing in here needs either
TemporaryFileSystem=/run:ro /dev/shm:ro
InaccessiblePaths=-/dev/mqueue -/dev/hugepages
# /sys is mounted last and cannot be covered whole, so each directory in it is
InaccessiblePaths=-/sys/fs -/sys/kernel -/sys/devices -/sys/firmware -/sys/class -/sys/bus -/sys/block -/sys/dev -/sys/module -/sys/hypervisor -/sys/power
ProtectProc=invisible
ProcSubset=pid
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
PrivateIPC=yes
UMask=0077

# ---- privileges ----
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
KeyringMode=private
SystemCallArchitectures=native
# a refused call answers EPERM, so a library probing for a syscall doesn't end the server
SystemCallErrorNumber=EPERM
SystemCallFilter=@system-service
SystemCallFilter=~@privileged @mount @debug @cpu-emulation @obsolete @raw-io @reboot @swap @module @clock
